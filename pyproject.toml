[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-catalog"
version = "0.1.0"
description = "A resumable, searchable local catalog of released Steam games."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Timofey Chudakov", email = "tvchudakov@spasibosb.ru" }]
keywords = ["steam", "catalog", "sqlite", "fts5", "web-scraping", "cli", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
steam-catalog = "steam_catalog.cli:run"

[project.urls]
Homepage = "https://github.com/Zrezlorez/steam-game-parser-py"
Repository = "https://github.com/Zrezlorez/steam-game-parser-py"
Issues = "https://github.com/Zrezlorez/steam-game-parser-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steam_catalog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["steam_catalog"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["steam_catalog"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
